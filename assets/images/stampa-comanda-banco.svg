<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" width="520" height="470" role="img" aria-label="Stampante da cucina che stampa la comanda di un ordine al banco">
  <defs>
    <linearGradient id="caseGrad" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#20487a"/>
      <stop offset="50%" stop-color="#123a63"/>
      <stop offset="100%" stop-color="#0b2540"/>
    </linearGradient>
    <linearGradient id="topGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a5a95"/>
      <stop offset="100%" stop-color="#17406e"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f6fa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#35c8ef"/>
      <stop offset="100%" stop-color="#1668c9"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b2540" flood-opacity="0.20"/>
    </filter>
    <filter id="paperShadow" x="-40%" y="-20%" width="180%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0b2540" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- ombra a terra -->
  <ellipse cx="260" cy="432" rx="150" ry="16" fill="#0b2540" opacity="0.12"/>

  <!-- ============ COMANDA IN USCITA ============ -->
  <g filter="url(#paperShadow)">
    <path d="M158 268
             L158 44
             q0 -10 10 -10
             L352 34
             q10 0 10 10
             L362 268 Z"
          fill="url(#paperGrad)"/>
    <!-- bordo strappato in alto -->
    <path d="M158 44 q0 -10 10 -10 L352 34 q10 0 10 10"
          fill="none" stroke="#e2e8f0" stroke-width="2"/>
  </g>

  <!-- intestazione comanda -->
  <text x="260" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="15" font-weight="700" letter-spacing="2" fill="#8296ad">COMANDA</text>

  <text x="260" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="40" font-weight="800" fill="#0b2540">005</text>

  <rect x="228" y="126" width="64" height="24" rx="12" fill="url(#accent)"/>
  <text x="260" y="143" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="13" font-weight="700" letter-spacing="1" fill="#ffffff">BANCO</text>

  <line x1="180" y1="166" x2="340" y2="166" stroke="#dbe3ec" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- righe prodotti -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#12263f">
    <text x="182" y="192" font-weight="700">2×</text>
    <text x="210" y="192">Margherita</text>

    <text x="182" y="220" font-weight="700">1×</text>
    <text x="210" y="220">Diavola</text>

    <text x="182" y="248" font-weight="700">3×</text>
    <text x="210" y="248">Coca Cola</text>
  </g>

  <!-- nota -->
  <rect x="180" y="258" width="160" height="4" rx="2" fill="#eef2f7"/>

  <!-- ============ CORPO STAMPANTE ============ -->
  <g filter="url(#soft)">
    <!-- piano superiore -->
    <path d="M112 292 q0 -18 18 -18 L390 274 q18 0 18 18 L408 300 L112 300 Z"
          fill="url(#topGrad)"/>
    <!-- fessura carta -->
    <rect x="150" y="280" width="220" height="9" rx="4.5" fill="#081c31"/>
    <!-- scocca -->
    <path d="M112 300 L408 300 L408 386 q0 22 -22 22 L134 408 q-22 0 -22 -22 Z"
          fill="url(#caseGrad)"/>
  </g>

  <!-- pannello frontale -->
  <rect x="140" y="326" width="240" height="56" rx="12" fill="#0a2340" opacity="0.55"/>

  <!-- spie -->
  <circle cx="168" cy="344" r="6" fill="#35e08a"/>
  <circle cx="168" cy="344" r="11" fill="#35e08a" opacity="0.22"/>
  <circle cx="196" cy="344" r="6" fill="#35c8ef"/>
  <circle cx="196" cy="344" r="11" fill="#35c8ef" opacity="0.22"/>

  <!-- etichetta stato -->
  <text x="216" y="349" font-family="Segoe UI, Arial, sans-serif" font-size="13"
        font-weight="600" letter-spacing="0.5" fill="#a9c4de">Stampa in corso…</text>

  <!-- pulsante avanzamento carta -->
  <rect x="316" y="358" width="48" height="14" rx="7" fill="#1d4b7d"/>

  <!-- piedini -->
  <rect x="146" y="408" width="34" height="8" rx="4" fill="#08203a"/>
  <rect x="340" y="408" width="34" height="8" rx="4" fill="#08203a"/>
</svg>
